# pii-guard — two checks on every push. Both only FAIL (GitHub emails the owner);
# neither rewrites history.
#
# 1. Author identity: every author/committer must be an adNET address, the
#    original maintainer's address, or a GitHub noreply address. A field agent's client-domain email or
#    an EC2 hostname as author fails the run. Fix the clone that made them
#    (git config user.name / user.email) and amend before pushing; if a bad
#    identity already reached main, an admin rewrites it by hand, deliberately.
#
# 2. Private denylist: fails the run when any commit's diff or message matches a
#    pattern from the PII_PATTERNS repo secret (one grep -E pattern per line).
#    Patterns live only in that secret, and on a hit this job prints commit SHAs
#    only, never the matched text, because public Actions logs are world-readable.
name: pii-guard

on: [push]

permissions:
  contents: read

concurrency:
  group: pii-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Author identity — fail on anything unexpected (never rewrite)
        run: |
          bad=$(git log --format='%ae%n%ce' HEAD | sort -u \
            | grep -vxE 'trevorjordan1@gmail\.com|[^@]+@adnet\.us|[^@]+@users\.noreply\.github\.com|noreply@github\.com' || true)
          if [ -z "$bad" ]; then
            echo "author check clean"
            exit 0
          fi
          n=$(printf '%s\n' "$bad" | wc -l)
          echo "::error::$n unexpected author/committer identit(y/ies) in history (not printed — public logs). Find them locally: git log --format='%h %ae %ce' | grep -vE '@adnet\.us|trevorjordan1@gmail\.com|noreply' — then fix by hand; this job never rewrites."
          exit 1

      - name: Private denylist scan (diffs + messages, full history)
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          if [ -z "$PII_PATTERNS" ]; then
            echo "PII_PATTERNS secret not set — skipping (expected on forks)."
            exit 0
          fi
          printf '%s\n' "$PII_PATTERNS" > "$RUNNER_TEMP/patterns"
          hits=0
          while read -r commit; do
            if git show "$commit" --format='%B' | grep -qiEf "$RUNNER_TEMP/patterns"; then
              echo "::error::Denylist hit in commit $commit (diff or message) — scan it locally; matched text is never printed here."
              hits=1
            fi
          done < <(git rev-list --all)
          [ "$hits" -eq 0 ] && echo "denylist scan clean"
          exit "$hits"
